apiVersion: apps/v1
kind: Deployment
metadata:
  name: lbv3-flask
  namespace: lbv3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lbv3-flask
  template:
    metadata:
      labels:
        app: lbv3-flask
    spec:
      containers:
        - name: lbv3-flask
          image: abdoabuharrus/lbv3.0-flask:v2.3
          ports:
            - containerPort: 8000
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: lbv3-flask-secret
                  key: DB_URL
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: lbv3-flask-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lbv3-flask-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lbv3-flask-secret
                  key: DB_PASSWORD
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: lbv3-flask-secret
                  key: DB_PORT
            - name: CLIENT_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: lbv3-flask-secret
                  key: CLIENT_ORIGIN
